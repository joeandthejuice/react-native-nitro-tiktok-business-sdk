name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_current:
        description: "Publish the current package.json version from the selected ref"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Prepare release PR or GitHub release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_current) }}
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          release-type: node

      - name: Checkout
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_current) || steps.release.outputs.release_created }}
        uses: actions/checkout@v6

      - name: Setup
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_current) || steps.release.outputs.release_created }}
        uses: ./.github/actions/setup

      - name: Setup Node.js for npm publish
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_current) || steps.release.outputs.release_created }}
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"

      - name: Setup npm for trusted publishing
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_current) || steps.release.outputs.release_created }}
        run: |
          npm install -g npm@11
          npm --version

      - name: Verify package contents
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_current) || steps.release.outputs.release_created }}
        run: |
          yarn prepare
          npm pack --dry-run

      - name: Publish to npm
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_current) || steps.release.outputs.release_created }}
        run: npm publish --provenance --access public
